<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8375a"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e8375a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <style>
      @keyframes glow1 { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes slideUp1 { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes slideUp2 { 0%,20%{opacity:0;transform:translateY(10px)} 30%,100%{opacity:1;transform:translateY(0)} }
      @keyframes slideUp3 { 0%,40%{opacity:0;transform:translateY(10px)} 50%,100%{opacity:1;transform:translateY(0)} }
      @keyframes slideUp4 { 0%,60%{opacity:0;transform:translateY(10px)} 70%,100%{opacity:1;transform:translateY(0)} }
      .c1 { animation: slideUp1 2s ease-out forwards; }
      .c2 { animation: slideUp2 2s ease-out forwards; }
      .c3 { animation: slideUp3 2s ease-out forwards; }
      .c4 { animation: slideUp4 2s ease-out forwards; }
      .glow { animation: glow1 3s ease-in-out infinite; }
    </style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8375a"/>
      <stop offset="100%" stop-color="#c92a47"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card with Gradient Border -->
  <rect x="2" y="2" width="596" height="316" rx="14" fill="#ffffff" stroke="url(#cardBorder)" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- ═══ Card 1: Aether Browser ═══ -->
  <g class="c1">
    <rect x="15" y="15" width="275" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="15" y="15" width="4" height="130" rx="2" fill="url(#accent)" class="glow"/>
    <text x="35" y="44" fill="#e8375a" font-family="monospace" font-size="16">🪐</text>
    <text x="55" y="44" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold">Aether Browser</text>
    <text x="35" y="66" fill="#64748b" font-family="monospace" font-size="10">Electron + Vite browser · AI sidecar</text>
    <text x="35" y="80" fill="#64748b" font-family="monospace" font-size="10">Python engine · Stitch design</text>
    <rect x="35" y="96" width="55" height="18" rx="4" fill="#e2e8f0"/>
    <text x="62" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Electron</text>
    <rect x="96" y="96" width="42" height="18" rx="4" fill="#e2e8f0"/>
    <text x="117" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Vite</text>
    <rect x="144" y="96" width="50" height="18" rx="4" fill="#e2e8f0"/>
    <text x="169" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Python</text>
    <rect x="200" y="96" width="55" height="18" rx="4" fill="#e2e8f0"/>
    <text x="227" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">FastAPI</text>
    <circle cx="38" cy="130" r="3" fill="#22c55e"/>
    <text x="48" y="134" fill="#64748b" font-family="monospace" font-size="8">active</text>
  </g>

  <!-- ═══ Card 2: NeonAI ═══ -->
  <g class="c2">
    <rect x="310" y="15" width="275" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="310" y="15" width="4" height="130" rx="2" fill="url(#accent)" class="glow"/>
    <text x="330" y="44" fill="#e8375a" font-family="monospace" font-size="16">⚡</text>
    <text x="350" y="44" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold">NeonAI</text>
    <text x="330" y="66" fill="#64748b" font-family="monospace" font-size="10">Local AI · semantic routing</text>
    <text x="330" y="80" fill="#64748b" font-family="monospace" font-size="10">5 modes · voice · zero cloud</text>
    <rect x="330" y="96" width="55" height="18" rx="4" fill="#e2e8f0"/>
    <text x="357" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Whisper</text>
    <rect x="391" y="96" width="50" height="18" rx="4" fill="#e2e8f0"/>
    <text x="416" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Ollama</text>
    <rect x="447" y="96" width="42" height="18" rx="4" fill="#e2e8f0"/>
    <text x="468" y="109" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Flask</text>
    <circle cx="333" cy="130" r="3" fill="#22c55e"/>
    <text x="343" y="134" fill="#64748b" font-family="monospace" font-size="8">active</text>
  </g>

  <!-- ═══ Card 3: Google ADK Systems ═══ -->
  <g class="c3">
    <rect x="15" y="165" width="275" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="15" y="165" width="4" height="130" rx="2" fill="url(#accent)" class="glow"/>
    <text x="35" y="194" fill="#e8375a" font-family="monospace" font-size="16">🤖</text>
    <text x="55" y="194" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold">Google ADK</text>
    <text x="35" y="216" fill="#64748b" font-family="monospace" font-size="10">Multi-agent AI framework</text>
    <text x="35" y="230" fill="#64748b" font-family="monospace" font-size="10">autonomous tools · Gemini</text>
    <rect x="35" y="246" width="66" height="18" rx="4" fill="#e2e8f0"/>
    <text x="68" y="259" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Google ADK</text>
    <rect x="107" y="246" width="50" height="18" rx="4" fill="#e2e8f0"/>
    <text x="132" y="259" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Gemini</text>
    <rect x="163" y="246" width="50" height="18" rx="4" fill="#e2e8f0"/>
    <text x="188" y="259" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Python</text>
    <circle cx="38" cy="280" r="3" fill="#22c55e"/>
    <text x="48" y="284" fill="#64748b" font-family="monospace" font-size="8">active</text>
  </g>

  <!-- ═══ Card 4: AI Mouse ═══ -->
  <g class="c4">
    <rect x="310" y="165" width="275" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="310" y="165" width="4" height="130" rx="2" fill="url(#accent)" class="glow"/>
    <text x="330" y="194" fill="#e8375a" font-family="monospace" font-size="16">🖱️</text>
    <text x="355" y="194" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold">AI Mouse</text>
    <text x="330" y="216" fill="#64748b" font-family="monospace" font-size="10">Hand gesture mouse control</text>
    <text x="330" y="230" fill="#64748b" font-family="monospace" font-size="10">real-time CV · hybrid ML</text>
    <rect x="330" y="246" width="55" height="18" rx="4" fill="#e2e8f0"/>
    <text x="357" y="259" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">OpenCV</text>
    <rect x="391" y="246" width="66" height="18" rx="4" fill="#e2e8f0"/>
    <text x="424" y="259" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">MediaPipe</text>
    <rect x="463" y="246" width="50" height="18" rx="4" fill="#e2e8f0"/>
    <text x="488" y="259" text-anchor="middle" fill="#e8375a" font-family="monospace" font-size="9" font-weight="bold">Python</text>
    <circle cx="333" cy="280" r="3" fill="#22c55e"/>
    <text x="343" y="284" fill="#64748b" font-family="monospace" font-size="8">done</text>
  </g>
</svg>
