<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <!-- Dark gradient overlay for text contrast over wallpaper -->
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13, 17, 23, 0.35)"/>
      <stop offset="50%" stop-color="rgba(13, 17, 23, 0.65)"/>
      <stop offset="100%" stop-color="rgba(13, 17, 23, 0.95)"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1000" height="420" rx="16"/>
    </clipPath>

    <clipPath id="avatarCircle">
      <circle cx="500" cy="115" r="55"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- 1. Background Wallpaper Image (Raw GitHub CDN URL) -->
    <image href="https://raw.githubusercontent.com/ansh2222949/ansh2222949/main/assets/header-wallpaper.jpg" width="1000" height="420" preserveAspectRatio="xMidYMid slice" />
    
    <!-- 2. Dark Overlay for text legibility -->
    <rect width="1000" height="420" fill="url(#overlayGrad)"/>

    <!-- 3. Glowing Cyberpunk Outline -->
    <rect width="1000" height="420" fill="none" stroke="rgba(232, 55, 90, 0.7)" stroke-width="3"/>

    <!-- 4. Corner Accent Markings -->
    <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#e8375a" stroke-width="2.5" opacity="0.8"/>
    <path d="M 980 50 L 980 20 L 950 20" fill="none" stroke="#e8375a" stroke-width="2.5" opacity="0.8"/>
    <path d="M 20 370 L 20 400 L 50 400" fill="none" stroke="#e8375a" stroke-width="2.5" opacity="0.8"/>
    <path d="M 980 370 L 980 400 L 950 400" fill="none" stroke="#e8375a" stroke-width="2.5" opacity="0.8"/>

    <!-- 5. Profile Photo Overlaid in Center -->
    <circle cx="500" cy="115" r="58" fill="none" stroke="#e8375a" stroke-width="3" filter="url(#glowEffect)"/>
    <image href="https://raw.githubusercontent.com/ansh2222949/ansh2222949/main/assets/ace-rounded.png" x="445" y="60" width="110" height="110" clip-path="url(#avatarCircle)" />

    <!-- 6. Overlaid Text Elements -->
    <g text-anchor="middle">
      <!-- Main Name -->
      <text x="500" y="225" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="900" letter-spacing="4" filter="url(#glowEffect)">𝕬𝕹𝖂𝕳 ♤</text>
      
      <!-- Subtitle & Titles -->
      <text x="500" y="265" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="16" font-weight="600">AI Architect • Voice Engineer • System Developer</text>
      <text x="500" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Offline-First • Local LLM • Multi-Agent Architecture</text>

      <!-- Tech Badges -->
      <g transform="translate(230, 335)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="#e8375a" stroke-width="1.2"/>
        <text x="80" y="22" fill="#e8375a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">🪐 Aether Browser</text>

        <rect x="180" y="0" width="160" height="34" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="#e8375a" stroke-width="1.2"/>
        <text x="260" y="22" fill="#e8375a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">🤖 Google ADK</text>

        <rect x="360" y="0" width="160" height="34" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="#e8375a" stroke-width="1.2"/>
        <text x="440" y="22" fill="#e8375a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">⚡ NeonAI Core</text>
      </g>
    </g>
  </g>
</svg>
