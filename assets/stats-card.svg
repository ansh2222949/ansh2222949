<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8375a"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e8375a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8375a"/>
      <stop offset="85%" style="stop-color:#e8375a"/>
      <stop offset="85%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8375a"/>
      <stop offset="80%" style="stop-color:#e8375a"/>
      <stop offset="80%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8375a"/>
      <stop offset="75%" style="stop-color:#e8375a"/>
      <stop offset="75%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8375a"/>
      <stop offset="90%" style="stop-color:#e8375a"/>
      <stop offset="90%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8375a"/>
      <stop offset="60%" style="stop-color:#e8375a"/>
      <stop offset="60%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8375a"/>
      <stop offset="85%" style="stop-color:#e8375a"/>
      <stop offset="85%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card with Gradient Border -->
  <rect x="2" y="2" width="496" height="336" rx="14" fill="#ffffff" stroke="url(#cardBorder)" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <path d="M 4 14 A 12 12 0 0 1 16 4 L 484 4 A 12 12 0 0 1 496 14 L 496 44 L 4 44 Z" fill="#f8fafc"/>
  <line x1="2" y1="44" x2="498" y2="44" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="250" y="28" text-anchor="middle" fill="#0f172a" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700">𝕬𝖓𝖘𝖍 ♤  ·  LV 25</text>
  <text x="470" y="28" text-anchor="end" fill="#e8375a" font-family="monospace" font-size="11" font-weight="700">CLASS: Architect</text>
  
  <!-- Stat rows -->
  <!-- AI Systems -->
  <text x="30" y="78" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">AI Systems</text>
  <rect x="160" y="66" width="260" height="16" rx="4" fill="url(#bar1)"/>
  <text x="435" y="78" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">85</text>
  
  <!-- Voice Pipeline -->
  <text x="30" y="114" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">Voice Pipeline</text>
  <rect x="160" y="102" width="260" height="16" rx="4" fill="url(#bar2)"/>
  <text x="435" y="114" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">80</text>
  
  <!-- Computer Vision -->
  <text x="30" y="150" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">Computer Vision</text>
  <rect x="160" y="138" width="260" height="16" rx="4" fill="url(#bar3)"/>
  <text x="435" y="150" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">75</text>
  
  <!-- Local-First ML -->
  <text x="30" y="186" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">Local-First ML</text>
  <rect x="160" y="174" width="260" height="16" rx="4" fill="url(#bar4)"/>
  <text x="435" y="186" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">90</text>
  
  <!-- UI / Frontend -->
  <text x="30" y="222" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">UI / Frontend</text>
  <rect x="160" y="210" width="260" height="16" rx="4" fill="url(#bar5)"/>
  <text x="435" y="222" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">60</text>
  
  <!-- System Design -->
  <text x="30" y="258" fill="#64748b" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">System Design</text>
  <rect x="160" y="246" width="260" height="16" rx="4" fill="url(#bar6)"/>
  <text x="435" y="258" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">85</text>
  
  <!-- Divider -->
  <line x1="20" y1="280" x2="480" y2="280" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Footer info -->
  <text x="30" y="305" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">ELEMENT</text>
  <text x="30" y="325" fill="#e8375a" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">🔥 Fire</text>
  
  <text x="170" y="305" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">TITLE</text>
  <text x="170" y="325" fill="#e8375a" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">卍解 Bankai</text>
  
  <text x="330" y="305" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">WEAPON</text>
  <text x="330" y="325" fill="#e8375a" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">🗡️ Code</text>
</svg>
