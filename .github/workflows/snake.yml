name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ansh2222949
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8375a&color_dots=#161b22,#1a0510,#3d0f1e,#6b1530,#e8375a
            dist/snake.gif?palette=github-dark&color_snake=#e8375a&color_dots=#161b22,#1a0510,#3d0f1e,#6b1530,#e8375a

      - name: Deploy to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output 2>/dev/null || (git checkout output && git reset --hard)
          git rm -rf . 2>/dev/null || true
          cp dist/* .
          git add snake-dark.svg snake.gif
          git commit -m "chore: update contribution snake animation [skip ci]" || exit 0
          git push origin output --force
